name: Test and deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: production-static-web-app
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:api

      - run: npm run test:content

      - run: npm run typecheck

      - run: npm run build

      - name: Verify Static Web Apps configuration
        run: test -f dist/staticwebapp.config.json

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Verify Docker compatibility build
        run: |
          docker build --tag kakeklar:compatibility .
          docker run --detach --rm --publish 8081:8080 --name kakeklar-compatibility kakeklar:compatibility
          trap 'docker stop kakeklar-compatibility' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8081/api/health > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8081/guider/barnehagebursdag)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8081/barnehagebursdag)" = 301
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8081/en-side-som-ikke-finnes)" = 404

      - name: Build production artifact
        run: npm run build:production
        env:
          # AdSense is on by default (ca-pub-6118980043742623, units 4250080584 in-article + 3563684870 multiplex).
          # Optional kill switch: VITE_ADSENSE_CLIENT: off
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          VITE_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ vars.ANALYTICS_ENABLED == '1' && secrets.APPINSIGHTS_CONNECTION_STRING || '' }}
          VITE_FEATURE_MENY_CART: ${{ vars.FEATURE_MENY_CART }}

      - name: Verify production artifact
        run: npm run verify:production-build
        env:
          VITE_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ vars.ANALYTICS_ENABLED == '1' && secrets.APPINSIGHTS_CONNECTION_STRING || '' }}
          VITE_FEATURE_MENY_CART: ${{ vars.FEATURE_MENY_CART }}

      - name: Smoke-test production build configuration
        run: npx playwright test e2e/build-config.spec.ts --project="desktop chromium"
        env:
          EXPECT_PRODUCTION_CONFIG: 1
          EXPECT_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
          EXPECT_MENY_ENABLED: ${{ vars.FEATURE_MENY_CART }}

      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist

      - name: Deploy frontend and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
